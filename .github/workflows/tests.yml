name: tests

on:
  push:
  pull_request:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (metrics only, no video or model dependencies)
        run: pip install numpy==2.5.4 pandas==3.1.1 scipy==1.18.1 pytest==8.4.2
      - name: Run tests
        run: PYTHONPATH=src pytest -q
