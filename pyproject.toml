[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorspace"
version = "0.1.0"
description = "Track NBA players in broadcast clips, map them to the court and measure floor spacing."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
